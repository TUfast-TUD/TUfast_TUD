<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="stylesheet" href="../Style.css">
    <script src="../Script.js" defer></script>
    <title>TUfast Safari</title>
</head>
<body>
    <main>
        <img src="../Icon.png" width="96" height="96" alt="TUfast">
        <h1 data-text="title"></h1>
        <p data-text="intro"></p>
        <p class="platform-ios" data-text="ios"></p>
        <p class="platform-mac state-unknown" data-text="macUnknown"></p>
        <p class="platform-mac state-on" data-text="macOn"></p>
        <p class="platform-mac state-off" data-text="macOff"></p>

        <p class="detail" data-text="privacy"></p>
